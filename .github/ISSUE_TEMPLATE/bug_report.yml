name: Bug report
description: Something does not work, or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead. Paste the exact command and its output.
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: How you installed it
      options:
        - pipx / uv tool / pip
        - Homebrew
        - Docker
        - From git or a source checkout
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mahoraga version`, or the image tag if you use Docker.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Machine
      description: OS, chip, memory, and Python version (for example "macOS 15, M2, 16 GB, Python 3.12").
    validations:
      required: true
  - type: input
    id: ollama
    attributes:
      label: Ollama and the agents
      description: Ollama version, the models you pulled, and which agent you ran (aider, opencode).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server log or the traceback, if there is one.
      render: text
