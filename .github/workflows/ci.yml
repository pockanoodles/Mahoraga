name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System build deps (hnswlib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify published benchmark claims
        # Recomputes every headline number from its committed per-case artifact.
        # No models or network: this is the guard against a README figure being
        # edited without the data to support it.
        run: orch bench verify

      - name: Test
        # Skip `slow`-marked tests (they load the real embedding model, which
        # needs a network download and isn't hermetic). The other ~1263 tests
        # mock Ollama/HTTP, so they run without a live daemon or models.
        run: pytest -m "not slow" -q
