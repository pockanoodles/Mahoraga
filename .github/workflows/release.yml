name: Release

# Pushing a tag such as v2.1.0 publishes that version to PyPI, to GitHub
# Releases and to ghcr.io. "Run workflow" on a branch runs the same build and
# the same checks but publishes nothing, so the pipeline can be tried first.
#
# The one-time setup (PyPI trusted publisher, the pypi environment, GHCR
# visibility, the Homebrew tap) and the steps after a run are in
# packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pockanoodles/mahoraga

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The tag must match the version in the code
        # PyPI never lets a version be uploaded twice, so a mismatch has to
        # stop here and not after the upload.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('backend/orchestrator/__version__.py')['__version__'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in backend/orchestrator/__version__.py" >&2
            exit 1
          fi

      - name: System build deps (hnswlib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Build the UI, the sdist and the wheel
        run: |
          bash scripts/build_ui.sh
          python -m pip install -U pip build
          python -m build

      - name: Install the wheel in a clean virtualenv and run it
        run: python scripts/smoke_wheel.py dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mahoraga/
    permissions:
      id-token: write # trusted publishing: no PyPI token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release with the distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sums=$(cd dist && sha256sum -- *)
          echo "$sums" > dist/SHA256SUMS
          {
            echo "### Checksums"
            echo '```'
            echo "$sums"
            echo '```'
            echo "The sdist checksum is the one the Homebrew formula needs."
          } >> "$GITHUB_STEP_SUMMARY"
          case "${GITHUB_REF_NAME#v}" in *[a-zA-Z]*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $pre

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
