<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Mahoraga measures whether local coding AI is worth it for your code, on your machine." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0a09" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mahoraga</title>
    <!-- Runs before first paint, so a saved theme never flashes the other one. -->
    <script>
      try {
        var t = localStorage.getItem("mh-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
