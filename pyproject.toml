[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahoraga"
version = "2.0.0-dev"
requires-python = ">=3.12"

[project.scripts]
orch = "backend.orchestrator.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "benchmark*"]
