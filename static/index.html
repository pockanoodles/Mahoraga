<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahoraga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar ops panel -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Ops</span>
        <div class="sidebar-header-actions">
          <button class="icon-btn" id="reset-workflow-btn" title="Reset workflow (Ctrl+Shift+R)">↺</button>
        </div>
      </div>

      <!-- Agent fleet -->
      <div class="sidebar-block">
        <div class="block-label">Fleet</div>
        <div id="agent-status-panel" class="agent-fleet"></div>
      </div>

      <!-- Workflow vine chart -->
      <div class="sidebar-section" id="vine-section">
        <div class="section-header">
          <span class="section-title">Workflow</span>
          <button class="section-chevron" data-section="vine">▾</button>
        </div>
        <div class="section-body" id="vine-body">
          <div id="vine-container">
            <svg id="vine-svg" width="100%" height="300"></svg>
            <div id="vine-empty" class="vine-empty">No active mission</div>
          </div>
          <div id="vine-tooltip" class="vine-tooltip" style="display:none"></div>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="sidebar-section" id="logs-section">
        <div class="section-header">
          <span class="section-title">History</span>
          <button class="section-chevron" data-section="logs">▾</button>
        </div>
        <div class="section-body" id="logs-body">
          <div id="logs-list" class="logs-list"></div>
          <div id="logs-empty" class="logs-empty" style="display:none">No history yet.</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="sidebar-footer">
        <button id="reset-workflow-btn" class="reset-btn" title="Reset workflow (Ctrl+Shift+R)">↺ Reset</button>
        <span id="metrics-text" class="metrics-text">idle</span>
      </div>

    </aside>

    <!-- ── Resize handle ───────────────────────────────────────────── -->
    <div id="divider" class="resize-handle">
      <button id="sidebar-collapse-btn" class="icon-btn collapse-btn" title="Toggle sidebar">‹</button>
    </div>

    <!-- ── Main column ────────────────────────────────────────────── -->
    <main class="main-col">

      <!-- Animated processing bar -->
      <div id="progress-bar" class="progress-bar"></div>

      <!-- Top bar -->
      <div class="main-topbar">
        <div class="backend-switcher" id="backend-switcher">
          <button class="backend-opt" data-backend="claude">Claude</button>
          <button class="backend-opt" data-backend="ollama">Ollama</button>
        </div>
        <button id="settings-btn" class="icon-btn topbar-btn" title="Settings">⚙</button>
      </div>

      <!-- Messages -->
      <div id="messages" class="messages" aria-live="polite">

        <!-- Empty / welcome state -->
        <div id="messages-empty" class="empty-state">
          <div class="empty-logo">M</div>
          <h2 class="empty-title">What can I help with?</h2>
          <p class="empty-sub">Routed intelligently across Claude, Ollama, Aider, Codex and more.</p>
          <div class="suggestion-chips">
            <button class="suggestion-chip" data-msg="Write a Python function to parse and validate JSON from an API response">
              <span class="chip-icon">⌥</span> Write code
            </button>
            <button class="suggestion-chip" data-msg="Plan an MVP for a habit tracking app — break it into concrete tasks">
              <span class="chip-icon">⬡</span> Plan a project
            </button>
            <button class="suggestion-chip" data-msg="Explain how attention mechanisms work in transformer models">
              <span class="chip-icon">◈</span> Explain a concept
            </button>
          </div>
        </div>

      </div>

      <!-- Routing status (visible while processing) -->
      <div id="routing-bar" class="routing-bar">
        <div class="routing-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="routing-text" class="routing-text">Analyzing…</span>
      </div>

      <!-- Composer -->
      <div class="composer">
        <div id="composer-box" class="composer-box">
          <textarea
            id="user-input"
            placeholder="Message Mahoraga…"
            rows="1"
            aria-label="Message"
          ></textarea>
          <div class="composer-controls">
            <span id="complexity-chip" class="complexity-chip" style="display:none"></span>
            <button id="send-btn" class="send-btn" aria-label="Send" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="composer-footer">
          <span>Enter to send · Shift+Enter for new line · Ctrl+Shift+R to reset</span>
        </div>
      </div>

    </main>
  </div>

  <!-- ── Settings drawer ────────────────────────────────────────────── -->
  <div id="drawer-overlay" class="drawer-overlay" style="display:none"></div>
  <div id="settings-drawer" class="settings-drawer" style="display:none">
    <div class="drawer-header">
      <span class="drawer-title">Settings</span>
      <button id="drawer-close-btn" class="icon-btn">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body">
      <p class="drawer-loading">Loading…</p>
    </div>
  </div>

  <script src="/static/resize.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
